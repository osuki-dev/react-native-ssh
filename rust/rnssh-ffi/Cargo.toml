[package]
name = "rnssh-ffi"
description = "C ABI over rnssh-core, consumed by the Nitro C++ HybridObjects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "rnssh_ffi"
# One static archive per target. It is linked into the Nitro module's own
# binary (libOsukiSsh.so on Android, the OsukiSsh pod on iOS), so there is a
# single native artifact per platform and no exported-symbol surface.
crate-type = ["staticlib"]

[lints]
workspace = true

[dependencies]
rnssh-core = { path = "../rnssh-core" }
tokio.workspace = true
log.workspace = true
dashmap = "6"
zeroize.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
oslog = { version = "0.2", default-features = false, features = ["logger"] }

[dev-dependencies]
rnssh-testserver = { path = "../rnssh-testserver" }
tokio = { workspace = true, features = ["full"] }
