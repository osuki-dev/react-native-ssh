language = "C"
include_guard = "RNSSH_H"
include_version = true
autogen_warning = "/* Generated by cbindgen from rust/rnssh-ffi. DO NOT EDIT — run scripts/gen-header.sh. */"
cpp_compat = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true
style = "both"

[export]
prefix = ""
include = ["RnsshCode", "RnsshAuthMethod", "RnsshConnectOptions", "RnsshHostKey", "RnsshKbiPrompt", "RnsshKbiChallenge", "RnsshConnectionCallbacks", "RnsshShellOptions", "RnsshShellCallbacks", "RnsshCompletion", "RnsshExecResult", "RnsshExecCallback", "RnsshKeyResult"]

[fn]
prefix = ""

[enum]
prefix_with_name = true
