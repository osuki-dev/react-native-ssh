name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (test, clippy, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2023-0071 (Marvin timing side-channel in the `rsa` crate, no fix
      # upstream) only affects RSA *private key* operations. It arrives through
      # russh's `rsa` feature, which we need to verify RSA host keys (public
      # operations, unaffected). See ARCHITECTURE.md → Security decisions.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  typescript:
    name: TypeScript + nitrogen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test src
      - run: bun run specs
      - name: nitrogen output must be committed
        run: git diff --exit-code -- nitrogen

  header:
    name: cbindgen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cbindgen --locked
      - run: bash scripts/gen-header.sh
      - run: git diff --exit-code -- cpp/rnssh.h

  native:
    name: Prebuilt Rust archives (iOS + Android)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo install cargo-ndk --locked
      - run: bash scripts/build-rust-ios.sh
      - run: bash scripts/build-rust-android.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - uses: actions/upload-artifact@v4
        with:
          name: rust-prebuilt
          path: |
            ios/RnsshFFI.xcframework
            android/rust-libs
